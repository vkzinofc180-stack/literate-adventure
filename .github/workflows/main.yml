
name: RDP DENISP - Windows 10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    name: Configure RDP DENISP
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:RDP_PASSWORD) {
            throw "Missing RDP_PASSWORD secret"
          }

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw "Missing TAILSCALE_AUTH_KEY secret"
          }

          Write-Host "=== RDP DENISP ==="

          # Configure Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Create secure RDP account
          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "RDP" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePass `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser `
              -Name "RDP" `
              -Password $securePass `
              -PasswordNeverExpires $true
          }

          # Add user to Remote Desktop Users
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"
          $user = Get-LocalUser -Name "RDP"

          $member = Get-LocalGroupMember `
            -Group $rdpGroup.Name `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.SID -eq $user.SID }

          if (-not $member) {
            Add-LocalGroupMember `
              -Group $rdpGroup.Name `
              -Member "RDP"
          }

          # Install Tailscale
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            $installer = "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile $installer

            Start-Process msiexec.exe `
              -ArgumentList "/i `"$installer`" /quiet /norestart" `
              -Wait

            Remove-Item $installer -Force
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            throw "Tailscale installation failed"
          }

          Start-Service -Name Tailscale

          # Connect to private Tailscale network
          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=rdp-denisp" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed"
          }

          # Get Tailscale IP
          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {
            $tsIP = (& $tsExe ip -4 | Out-String).Trim()

            if ($tsIP -match '^100\.') {
              break
            }

            $tsIP = $null
            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
            throw "Tailscale IP unavailable"
          }

          # Disable broad built-in RDP firewall rules
          Get-NetFirewallRule -Name "RemoteDesktop-*" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          # Remove old custom rule
          Get-NetFirewallRule `
            -DisplayName "RDP-DENISP-TAILSCALE" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          # Allow RDP only from Tailscale IP range
          New-NetFirewallRule `
            -DisplayName "RDP-DENISP-TAILSCALE" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          # Start Remote Desktop service
          Start-Service -Name TermService

          # Verify RDP listener
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "RDP port 3389 is not listening"
          }

          Write-Host ""
          Write-Host "===== RDP DENISP ACTIVE ====="
          Write-Host "Address: $tsIP"
          Write-Host "Port: 3389"
          Write-Host "Username: RDP"
          Write-Host "Password: Stored in GitHub Secrets"
          Write-Host "Security: NLA enabled"
          Write-Host "VPN: Tailscale"
          Write-Host "============================"
concurrency:
  
